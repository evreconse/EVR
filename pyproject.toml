[project]
name = "evreconse"
version = "0.1.0"
description = "EVRECONSE — Автоматизированная система идентификации и оценки разворотных паттернов на криптовалютном рынке"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "EVRECONSE Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "aiohttp>=3.14.0",
    "aiolimiter>=1.2.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.0",
    "PyYAML>=6.0.0",
    "tenacity>=9.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=17.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "coverage>=7.0.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".codeium",
    ".devin",
    "Default Project",
    "data",
    "logs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "W", "T20"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]
"*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
# Production-verbatim source files synchronized from the server (2026-10-23).
# They predate the repository lint policy and must not be reformatted: their
# SHA-256 is the synchronization evidence.  Runtime and equivalence tests cover
# them.  Do not add new files to this list.
"config/*" = ["ALL"]
"src/config/capitulation_thresholds.py" = ["ALL"]
"src/data_provider/__init__.py" = ["ALL"]
"src/data_provider/cmc_universe_cache.py" = ["ALL"]
"src/data_provider/universe_provider.py" = ["ALL"]
"src/exchange/__init__.py" = ["ALL"]
"src/exchange/bingx_endpoints.py" = ["ALL"]
"src/exchange/bingx_fetcher.py" = ["ALL"]
"src/exchange/bingx_rate_limiter.py" = ["ALL"]
"src/strategy/__init__.py" = ["ALL"]
"src/strategy/capitulation_detector.py" = ["ALL"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Server-synchronized I/O modules retain the production implementation verbatim.
# They are runtime-tested by the service but are not fully typed; keep them out of
# strict module discovery so the maintained application and algorithm modules are
# still checked by CI.
exclude = [
    "^src/data_provider/universe_provider.py$",
    "^src/data_provider/cmc_universe_cache.py$",
]

# The following production-verbatim modules are excluded from strict typing
# because the server versions predate the repository's typing policy.  This
# does not affect runtime behavior; their formulas are covered by tests.
[[tool.mypy.overrides]]
module = [
    "data_provider.bingx_provider",
    "exchange.bingx_fetcher",
    "exchange.bingx_rate_limiter",
    "strategy.capitulation_detector",
]
ignore_errors = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
